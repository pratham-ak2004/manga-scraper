volumes:
  manga-scraper-dbs:
  manga-scraper-data:
  manga-scraper-config:

networks:
  public:
    driver: bridge
  internal:
    driver: bridge

services:
  nginx:
    image: nginx:1.25
    container_name: manga-scraper-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - manga-scraper-config:/etc/nginx/conf.d
    networks:
      - public
      - internal
    restart: unless-stopped
    depends_on:
      - server

  postgres:
    image: postgres:18
    container_name: manga-scraper-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    expose:
      - "5432"
    networks:
      - internal
    volumes:
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: manga-scraper-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-password}
    expose:
      - 5672
      - 15672
    networks:
      - internal
    volumes:
      - manga-scraper-dbs:/var/lib/rabbitmq
      - manga-scraper-dbs:/var/log/rabbitmq
    restart: unless-stopped

  redis:
    image: redis:8.4
    container_name: manga-scraper-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --user
      - ${REDIS_USERNAME}
      - "on"
      - ">${REDIS_PASSWORD}"
      - ~*
      - +@all
    expose:
      - "6379"
    networks:
      - internal
    volumes:
      - manga-scraper-dbs:/data
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: dockerfile
    container_name: manga-scraper-server
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - manga-scraper-data:/app/data
    expose:
      - "8080"
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - worker

  worker:
    build:
      context: ./
      dockerfile: dockerfile
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - REDIS_USERNAME=${REDIS_USERNAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
    volumes:
      - manga-scraper-data:/app/data
    networks:
      - public
      - internal
    # deploy:
    #   replicas: 2
    depends_on:
      - rabbitmq
      - redis
    restart: unless-stopped

root = "."
testdata_dir = "testdata"
tmp_dir = "bin"

[build]
  args_bin = []
  bin = "./bin/app"
  cmd = "go build -o bin/app cmd/main.go"
  delay = 1000
  exclude_dir = ["assets", "bin", "vendor", "testdata", "node_modules", "tmp", "public"]
  exclude_file = []
  exclude_regex = ["_test.go","_templ.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "templ", "css"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = ["bunx --bun @tailwindcss/cli -i ./views/global.css -o ./public/assets/css/index.css --minify","go tool templ generate"]
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 8080
  enabled = true
  proxy_port = 3000

[screen]
  clear_on_rebuild = false
  keep_scroll = true